<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K8s Live Visualizer</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#262a36; --text:#e6e8ee; --dim:#8a90a2; --ok:#3ecf8e; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 28px; border-bottom:1px solid var(--line); display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  .msg { color:var(--dim); }
  .stats { display:flex; gap:20px; margin-left:auto; }
  .stat b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  main { display:grid; grid-template-columns: 1fr 340px; gap:0; min-height:calc(100vh - 82px); }
  section { padding:24px 28px; }
  aside { border-left:1px solid var(--line); padding:24px; background:var(--panel); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; align-items:center; }
  button { background:#232838; color:var(--text); border:1px solid #333a4d; padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  button:hover { background:#2c3246; }
  button.on { background:#3a2a12; border-color:#a86b12; }
  button.danger { border-color:#6b2a2a; }
  label { color:var(--dim); }
  .pods { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px; }
  .pod { background:var(--panel); border:1px solid color-mix(in srgb, var(--c) 40%, var(--line)); border-radius:12px; padding:14px 16px; transition:opacity .6s, transform .2s, border-color .2s; }
  .pod.flash { transform:scale(1.03); border-color:var(--c); }
  .pod.gone { opacity:.3; }
  .pod .name { font-family:ui-monospace, monospace; font-size:13px; word-break:break-all; }
  .pod .meta { color:var(--dim); font-size:12px; margin-top:4px; }
  .bar { height:6px; background:#232838; border-radius:3px; margin-top:10px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--c); transition:width .3s; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; background:var(--c); color:#000; font-weight:600; }
  .empty { color:var(--dim); padding:40px; text-align:center; border:1px dashed var(--line); border-radius:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 12px; }
  #log { font-family:ui-monospace, monospace; font-size:12px; max-height:calc(100vh - 200px); overflow:auto; }
  #log div { padding:4px 0; border-bottom:1px solid var(--line); }
  #log .t { color:var(--dim); margin-right:6px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  @media (max-width: 860px) { main { grid-template-columns:1fr; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Kubernetes Live Visualizer</h1>
    <div class="msg" id="message">waiting for first response…</div>
  </div>
  <div class="stats">
    <div class="stat"><b id="sPods">0</b><span>live pods</span></div>
    <div class="stat"><b id="sReq">0</b><span>requests</span></div>
    <div class="stat"><b id="sErr">0</b><span>errors</span></div>
  </div>
</header>
<main>
  <section>
    <div class="controls">
      <button id="pause">Pause</button>
      <label>Requests/sec
        <select id="rate"><option>2</option><option selected>5</option><option>10</option><option>20</option></select>
      </label>
      <button id="burn" title="Ask pods to burn CPU so the autoscaler reacts">Browser CPU load: off</button>
      <button id="crash" class="danger" title="Kill whichever pod answers. Kubernetes restarts it.">Crash a pod</button>
      <button id="reset">Reset counts</button>
    </div>
    <div class="pods" id="pods"><div class="empty">No pods have answered yet.</div></div>
  </section>
  <aside>
    <h2>Event log</h2>
    <div id="log"></div>
  </aside>
</main>

<script>
// Each request is a NEW connection (server sends Connection: close), so the
// Kubernetes Service can pick a different pod every time. We just tally who answered.
const pods = new Map();          // podName -> { info, hits, lastSeen }
let total = 0, errors = 0, paused = false, timer = null, burnTimer = null;
const GONE_AFTER_MS = 4000;      // no answer for 4s => pod is probably gone
const $ = (id) => document.getElementById(id);

function log(text, cls = '') {
  const d = document.createElement('div');
  d.innerHTML = `<span class="t">${new Date().toLocaleTimeString()}</span><span class="${cls}">${text}</span>`;
  $('log').prepend(d);
  while ($('log').children.length > 200) $('log').lastChild.remove();
}

async function poll() {
  try {
    const r = await fetch('/api/whoami', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const info = await r.json();
    total++;
    let p = pods.get(info.pod);
    if (!p) {
      p = { hits: 0 };
      pods.set(info.pod, p);
      log(`new pod answered: ${info.pod} (v${info.version} on ${info.node})`, 'ok');
    } else if (p.gone) {
      log(`pod is back: ${info.pod}`, 'ok');
    }
    p.info = info; p.hits++; p.lastSeen = Date.now(); p.gone = false; p.flash = true;
    $('message').textContent = info.message;
  } catch (e) {
    errors++;
    if (errors % 5 === 1) log(`request failed (${e.message}) — no ready pods?`, 'bad');
  }
}

function render() {
  const now = Date.now();
  for (const [name, p] of pods) {
    if (!p.gone && now - p.lastSeen > GONE_AFTER_MS) { p.gone = true; log(`pod stopped answering: ${name}`, 'bad'); }
    if (p.gone && now - p.lastSeen > 30000) pods.delete(name);
  }
  const live = [...pods.values()].filter(p => !p.gone);
  const liveHits = live.reduce((s, p) => s + p.hits, 0) || 1;
  $('sPods').textContent = live.length;
  $('sReq').textContent = total;
  $('sErr').textContent = errors;

  const list = [...pods.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  if (!list.length) return;
  $('pods').innerHTML = list.map(([name, p]) => {
    const pct = p.gone ? 0 : Math.round(100 * p.hits / liveHits);
    const html = `<div class="pod ${p.gone ? 'gone' : ''} ${p.flash ? 'flash' : ''}" style="--c:${p.info.color}">
      <div><span class="tag">v${p.info.version}</span></div>
      <div class="name" style="margin-top:8px">${name}</div>
      <div class="meta">node: ${p.info.node} · up ${p.info.uptimeSec}s</div>
      <div class="meta">${p.hits} hits · ${pct}% of traffic${p.gone ? ' · <b class="bad">gone</b>' : ''}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>`;
    p.flash = false;
    return html;
  }).join('');
}

function start() {
  clearInterval(timer);
  timer = setInterval(() => !paused && poll(), 1000 / Number($('rate').value));
}

$('rate').onchange = start;
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
$('reset').onclick = () => { for (const p of pods.values()) p.hits = 0; total = errors = 0; };
$('crash').onclick = async () => {
  try {
    const r = await (await fetch('/api/crash', { method: 'POST' })).json();
    log(`💥 crashed ${r.pod} — watch Kubernetes restart it`, 'bad');
  } catch { log('crash request failed', 'bad'); }
};
$('burn').onclick = () => {
  if (burnTimer) { clearInterval(burnTimer); burnTimer = null; $('burn').textContent = 'Browser CPU load: off'; $('burn').classList.remove('on'); return; }
  burnTimer = setInterval(() => fetch('/api/burn?ms=300').catch(() => {}), 100);
  $('burn').textContent = 'Browser CPU load: ON'; $('burn').classList.add('on');
  log('started CPU load from the browser (for real load use: make load)');
};

start();
setInterval(render, 250);
</script>
</body>
</html>
